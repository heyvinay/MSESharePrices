name: Update BOV quote feed

on:
  schedule:
    # Daily, well after MSE's end-of-day publication. Times are UTC.
    - cron: "0 18 * * 1-5"
  workflow_dispatch:
    inputs:
      manual_urls:
        description: >
          Optional space-separated MSE workbook URLs to bypass archive-page
          discovery (see docs/qa.md manual verification checklist).
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (fallback .xls converter)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Run tests
        run: pytest tests/

      - name: Generate BOV feed
        env:
          MANUAL_URLS: ${{ github.event.inputs.manual_urls }}
          MSE_DEBUG_DUMP_DIR: ${{ github.event.inputs.manual_urls && 'debug-dump' || '' }}
        run: |
          # discover_urls() against the live archive page returns no links when
          # fetched by an automated client (the page is likely JS-rendered) --
          # see docs/architecture.md and docs/qa.md. The real, confirmed-working
          # download URL pattern for MSE's yearly archive is a .zip, not a bare
          # .xls (see docs/decision-log.md, 2026-07-20 zip/olefile entries), so
          # default to the current year's archive unless overridden.
          if [ -n "$MANUAL_URLS" ]; then
            ARCHIVE_URLS="$MANUAL_URLS"
          else
            YEAR=$(date +%Y)
            ARCHIVE_URLS="https://cdn.borzamalta.com.mt/download/archives/Trading-Statistics/Trading-Statistics${YEAR}.zip"
          fi
          ARGS=()
          for url in $ARCHIVE_URLS; do
            ARGS+=(--manual-url "$url")
          done
          python src/mse_pp_feed.py --symbol BOV --output-json docs/json/BOV.json "${ARGS[@]}"

      - name: Upload debug dump (manual runs only)
        if: always() && github.event.inputs.manual_urls
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: debug-dump/
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit updated feed if changed
        run: |
          # `git diff --quiet` only detects changes to already-tracked files --
          # it silently ignores a brand-new, untracked docs/json/BOV.json (as
          # happened on this repo's very first successful run). Stage first,
          # then check the *staged* diff, which correctly covers new files too.
          git add docs/json/BOV.json
          if git diff --cached --quiet -- docs/json/BOV.json; then
            echo "No changes to docs/json/BOV.json; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh BOV quote feed"
          git push
